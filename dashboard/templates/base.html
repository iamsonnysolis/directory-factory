<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Directory Factory{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <!-- Global Shell: Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <a href="/" class="logo">Directory Factory</a>
        <nav class="top-bar-nav">
          <a href="/?view=overview" class="{% if not view or view == 'overview' %}active{% endif %}">Overview</a>
          <a href="/?view=pipeline" class="{% if view == 'pipeline' %}active{% endif %}">Pipeline</a>
          <a href="/?view=deploy" class="{% if view == 'deploy' %}active{% endif %}">Deploy</a>
        </nav>
      </div>
      <nav class="top-bar-nav">
        <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">Settings</a>
      </nav>
    </header>

    <!-- Toast container (bottom-right) -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Page content -->
    <main class="page-content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/app.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
