{% extends "base.html" %}
{% block title %}Settings — Directory Factory{% endblock %}

{% block content %}
<h1 style="font-size:24px;font-weight:700;margin-bottom:8px;">Settings</h1>
<p style="color:#666;margin-bottom:24px;font-size:13px;">Manage credentials and default values. Changes save to <code>.env</code>.</p>

<form id="settings-form">
  <div class="settings-section">
    <h3>Credentials</h3>
    <div class="settings-row">
      <label>Google Places API Key</label>
      <input type="text" name="GOOGLE_PLACES_API_KEY" value="{{ env.get('GOOGLE_PLACES_API_KEY', '') }}" readonly style="background:#f9f9f9;">
    </div>
    <div class="settings-row">
      <label>Gemini API Key</label>
      <input type="text" name="GEMINI_API_KEY" value="{{ env.get('GEMINI_API_KEY', '') }}" readonly style="background:#f9f9f9;">
    </div>
    <div class="settings-row">
      <label>Cloudflare API Token</label>
      <input type="text" name="CLOUDFLARE_API_TOKEN" value="{{ env.get('CLOUDFLARE_API_TOKEN', '') }}" readonly style="background:#f9f9f9;">
      <button type="button" class="btn btn-test" data-action="test-credential" data-key="CLOUDFLARE_API_TOKEN">Test</button>
    </div>
    <div class="settings-row">
      <label>Cloudflare Account ID</label>
      <input type="text" name="CLOUDFLARE_ACCOUNT_ID" value="{{ env.get('CLOUDFLARE_ACCOUNT_ID', '') }}" readonly style="background:#f9f9f9;">
      <button type="button" class="btn btn-test" data-action="test-credential" data-key="CLOUDFLARE_ACCOUNT_ID">Test</button>
    </div>
    <div class="settings-row">
      <label>GitHub Token</label>
      <input type="text" name="GITHUB_TOKEN" value="{{ env.get('GITHUB_TOKEN', '') }}" readonly style="background:#f9f9f9;">
      <button type="button" class="btn btn-test" data-action="test-credential" data-key="GITHUB_TOKEN">Test</button>
    </div>
  </div>

  <div class="settings-section">
    <h3>Defaults</h3>
    <div class="settings-row">
      <label>Default field tier</label>
      <select name="DEFAULT_FIELD_TIER">
        <option value="Essentials" {{ 'selected' if env.get('DEFAULT_FIELD_TIER', '') == 'Essentials' else '' }}>Essentials</option>
        <option value="Pro" {{ 'selected' if env.get('DEFAULT_FIELD_TIER', '') == 'Pro' else '' }}>Pro</option>
        <option value="Enterprise" {{ 'selected' if env.get('DEFAULT_FIELD_TIER', '') == 'Enterprise' else '' }}>Enterprise</option>
      </select>
    </div>
    <div class="settings-row">
      <label>Default grid step (km)</label>
      <input type="number" name="SEARCH_STEP_KM" value="{{ env.get('SEARCH_STEP_KM', '10') }}">
    </div>
  </div>
</form>

<div style="margin-top: 24px;">
  <button type="button" class="btn btn-primary" id="save-settings">Save Settings</button>
  <span id="save-status" style="font-size:13px;color:#666;margin-left:12px;"></span>
</div>

<script>
document.getElementById('save-settings').addEventListener('click', async function() {
  const formData = new FormData(document.getElementById('settings-form'));
  const settings = {};
  for (const [key, value] of formData.entries()) {
    settings[key] = value;
  }
  const resp = await fetch('/api/settings/save', {
    method: 'POST',
    body: new URLSearchParams({ settings: JSON.stringify(settings) }),
  });
  const data = await resp.json();
  if (data.success) {
    document.getElementById('save-status').textContent = 'Saved!';
    setTimeout(() => { document.getElementById('save-status').textContent = ''; }, 3000);
  }
});
</script>
{% endblock %}
